name: Cogni
description: Cogni is a non-custodial cryptocurrency wallet and digital-asset management app that consolidates
  cash, crypto, and NFTs in a single mobile experience. Users hold their own private keys, back up their
  seed phrase to iCloud, manage assets across multiple blockchains and Layer 2 networks, store and view
  NFTs, and connect to web3 dApps directly from the app. Backed by Techstars, Cogni is a consumer-facing
  mobile product and publishes no public developer API, SDK, or OpenAPI at this time; this profile captures
  its public web properties and domain-security posture.
